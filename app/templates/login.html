<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mitti Se Mandi</title>
    <!-- Linking the separate Login CSS file -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>

    <div class="login-container">
        

        <!-- Login Card -->
        <div class="login-card">
            <h2 class="welcome-title">Welcome Back</h2>
            <p class="welcome-subtitle">Login to your account</p>

            <form class="login-form" action="{{ url_for('auth.login') }}" method="POST">
                
                <!-- Email Input -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                </div>

                <!-- Password Input -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <!-- Forgot Password Link -->
                <div class="forgot-password">
                    <a href="#">Forgot Password?</a>
                </div>

                <!-- Login Button -->
                <button type="submit" class="login-btn">LOGIN</button>
            </form>

            <!-- Register Link -->
            <div class="register-link">
                <p>Don't have an account?</p>
                <a href="{{ url_for('auth.register') }}">Register Now</a>
            </div>
        </div>

    </div>

</body>
</html>
